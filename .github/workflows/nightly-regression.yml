name: Nightly Regression

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC daily = 21:00 (9:00 PM) Vietnam time
  workflow_dispatch: {}    # Manual trigger
  push:
    branches: ["main"]  # Also run on push to keep it scoped

jobs:
  regression:
    name: Full Regression Test
    runs-on: ubuntu-latest
    # Cron always runs on the default branch; this guard ensures the job
    # is a no-op when triggered on any branch other than main
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install requests
          pip install -r backend/requirements.txt
        
      - name: Run Regression Test
        run: python tests/regression_test.py
        env:
          # Falls back to the public Render URL if the secret is not configured
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://rag-vn-finance-backend.onrender.com' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
      - name: Upload Regression Report
        uses: actions/upload-artifact@v4
        if: always() # Upload even if test fails
        with:
          name: regression-report
          path: tests/regression_report.csv

