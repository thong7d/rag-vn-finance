name: Keep Alive Embedding Space

on:
  schedule:
    # Run every 12 hours (00:00 and 12:00 UTC)
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/keep-alive-embedding.yml"

jobs:
  ping:
    name: Ping HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gradio-client
        run: pip install gradio-client

      - name: Ping Gradio Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          from gradio_client import Client

          token = os.environ.get("HF_TOKEN", "").strip() or None
          space_id = "thong7d/e5-embedding-api"
          print(f"Connecting to {space_id} (authenticated: {token is not None})...")

          client = Client(space_id, token=token) if token else Client(space_id)
          res = client.predict(
              text="query: ping",
              api_name="/encode"
          )
          print("Ping successful! Result received:", bool(res))
          EOF
